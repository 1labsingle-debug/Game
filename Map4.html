<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Isométrico GTA2 - Chunks & Inventário</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            color: #fff;
        }

        /* Canvas Fullscreen */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD - Top Bar */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 10;
            border-bottom: 2px solid #1f2833;
        }

        .stats-container {
            display: flex;
            gap: 12px;
        }

        .stat-box {
            background: rgba(31, 40, 51, 0.8);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #45a29e;
        }

        /* HUD - Inventário / Hotbar */
        #inventory-bar {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(11, 12, 16, 0.85);
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #45a29e;
            z-index: 10;
            pointer-events: auto;
        }

        .inv-slot {
            width: 44px;
            height: 44px;
            background: #1f2833;
            border: 1px solid #66fcf1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }

        .inv-slot:hover {
            background: #45a29e;
        }

        .inv-qty {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #66fcf1;
            font-weight: bold;
        }

        /* HUD - Controles Inferiores */
        #controls-container {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }

        /* Joystick Virtual */
        #joystick-zone {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(102, 252, 241, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-stick {
            width: 44px;
            height: 44px;
            background: #66fcf1;
            border-radius: 50%;
            position: absolute;
            top: 33px;
            left: 33px;
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.6);
        }

        /* Botões de Ação */
        #action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 52px);
            gap: 10px;
            pointer-events: auto;
        }

        .btn-action {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-a { background: #2ec4b6; }
        .btn-b { background: #e71d36; }
        .btn-c { background: #ff9f1c; }
        .btn-phone { background: #66fcf1; color: #0b0c10; font-size: 20px; }

        /* Smartphone Interface (Pop-up Lateral) */
        #smartphone {
            position: absolute;
            right: -320px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            height: 520px;
            background: #0b0c10;
            border: 4px solid #1f2833;
            border-radius: 30px;
            z-index: 30;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: -10px 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #smartphone.active {
            right: 20px;
        }

        .phone-header {
            background: #1f2833;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #66fcf1;
            border-bottom: 1px solid #45a29e;
        }

        .phone-apps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .app-box {
            width: 50px;
            height: 50px;
            background: #1f2833;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid #45a29e;
        }

        .app-box:hover {
            background: #66fcf1;
            color: #0b0c10;
        }

        /* Modais */
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1f2833;
            border: 2px solid #66fcf1;
            padding: 20px;
            border-radius: 12px;
            z-index: 40;
            width: 85%;
            max-width: 360px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HUD Superior -->
    <div id="top-bar">
        <div style="font-weight: bold; color: #66fcf1;">⚡ MUNDO ISOMÉTRICO</div>
        <div class="stats-container">
            <div class="stat-box">⚡ <span id="satsDisplay" style="color:#f7931a;">1,250</span></div>
            <div class="stat-box">📍 <span id="coordsDisplay">0, 0</span></div>
        </div>
    </div>

    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Hotbar / Inventário -->
    <div id="inventory-bar">
        <div class="inv-slot" title="Skate">🛹<span class="inv-qty">1</span></div>
        <div class="inv-slot" title="Energético">🥤<span class="inv-qty">3</span></div>
        <div class="inv-slot" title="Chave de Roda">🔧<span class="inv-qty">1</span></div>
        <div class="inv-slot"></div>
        <div class="inv-slot"></div>
    </div>

    <!-- HUD Inferior (Controles) -->
    <div id="controls-container">
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>

        <div id="action-buttons">
            <button class="btn-action btn-a" onclick="interact()">A</button>
            <button class="btn-action btn-b" onclick="useItem()">B</button>
            <button class="btn-action btn-c" onclick="sprint()">C</button>
            <button class="btn-action btn-phone" onclick="togglePhone()">📱</button>
        </div>
    </div>

    <!-- Smartphone -->
    <div id="smartphone">
        <div class="phone-header">SMARTPHONE</div>
        <div class="phone-apps">
            <div class="app-icon" onclick="openApp('Mapa')">
                <div class="app-box">🗺️</div>
                <span>Mapa</span>
            </div>
            <div class="app-icon" onclick="openApp('Thrnd Wallet')">
                <div class="app-box">⚡</div>
                <span>Satoshis</span>
            </div>
            <div class="app-icon" onclick="openApp('Loja Ads')">
                <div class="app-box">🛍️</div>
                <span>Lojas</span>
            </div>
            <div class="app-icon" onclick="openApp('Chat')">
                <div class="app-box">💬</div>
                <span>Chat</span>
            </div>
            <div class="app-icon" onclick="openApp('SAC / Suporte')">
                <div class="app-box">🎧</div>
                <span>SAC</span>
            </div>
        </div>
    </div>

    <!-- Modal Generico -->
    <div id="modal" class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Info</h3>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Configuração de Chunks e Isometric Grid
        const CHUNK_SIZE = 8; // 8x8 tiles por chunk
        const TILE_WIDTH = 64;
        const TILE_HEIGHT = 32;

        // Jogador e Câmera
        const player = {
            worldX: 0,
            worldY: 0,
            speed: 0.08
        };

        // Estrutura de PONTOS FIXOS no Mundo Infinito
        const worldPointsOfInterests = [
            { name: "Vestiário (Customização)", x: 2, y: 2, color: "#e71d36", type: "custom" },
            { name: "Praça Sk8 (Pista & Bancos)", x: -4, y: 5, color: "#2ec4b6", type: "skate" },
            { name: "Área de Eventos & Thrnd", x: 6, y: -6, color: "#ff9f1c", type: "events" },
            { name: "Centro Comercial", x: -8, y: -4, color: "#a06cd5", type: "shops" },
            { name: "Sede ADM", x: 0, y: 10, color: "#00bbf9", type: "adm" }
        ];

        // Projetar Posição 2D World para Tela com foco na Câmera (GTA2 Style)
        function worldToScreen(wx, wy) {
            // Posição relativa ao Jogador (Câmera centralizada)
            const relX = wx - player.worldX;
            const relY = wy - player.worldY;

            const screenX = (canvas.width / 2) + (relX - relY) * (TILE_WIDTH / 2);
            const screenY = (canvas.height / 2) + (relX + relY) * (TILE_HEIGHT / 2);
            return { x: screenX, y: screenY };
        }

        // Renderização do Mundo por Chunks
        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calcular o Chunk atual do jogador
            const currentChunkX = Math.floor(player.worldX / CHUNK_SIZE);
            const currentChunkY = Math.floor(player.worldY / CHUNK_SIZE);

            // Desenhar Chunks no Raio de Visão (ex: 2 Chunks de distância)
            const renderRadius = 2;
            for (let cx = currentChunkX - renderRadius; cx <= currentChunkX + renderRadius; cx++) {
                for (let cy = currentChunkY - renderRadius; cy <= currentChunkY + renderRadius; cy++) {
                    drawChunk(cx, cy);
                }
            }

            // Renderizar Pontos de Interesse do Mundo
            worldPointsOfInterests.forEach(pt => {
                const pos = worldToScreen(pt.x, pt.y);
                
                // Desenhar Marcador de Edifício
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y - 15);
                ctx.lineTo(pos.x + 20, pos.y);
                ctx.lineTo(pos.x, pos.y + 15);
                ctx.lineTo(pos.x - 20, pos.y);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "10px Segoe UI";
                ctx.textAlign = "center";
                ctx.fillText(pt.name, pos.x, pos.y - 22);
            });

            // Renderizar Jogador no Centro Exato da Tela
            const center = { x: canvas.width / 2, y: canvas.height / 2 };
            ctx.fillStyle = "#66fcf1";
            ctx.beginPath();
            ctx.arc(center.x, center.y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Atualiza coordenadas na HUD
            document.getElementById('coordsDisplay').innerText = `${Math.round(player.worldX)}, ${Math.round(player.worldY)}`;

            requestAnimationFrame(renderScene);
        }

        function drawChunk(chunkX, chunkY) {
            const startTileX = chunkX * CHUNK_SIZE;
            const startTileY = chunkY * CHUNK_SIZE;

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let y = 0; y < CHUNK_SIZE; y++) {
                    const tileWorldX = startTileX + x;
                    const tileWorldY = startTileY + y;
                    const pos = worldToScreen(tileWorldX, tileWorldY);

                    // Só desenha se estiver visível no Canvas (Culling)
                    if (pos.x > -TILE_WIDTH && pos.x < canvas.width + TILE_WIDTH &&
                        pos.y > -TILE_HEIGHT && pos.y < canvas.height + TILE_HEIGHT) {
                        
                        ctx.beginPath();
                        ctx.moveTo(pos.x, pos.y);
                        ctx.lineTo(pos.x + TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                        ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
                        ctx.lineTo(pos.x - TILE_WIDTH / 2, pos.y + TILE_HEIGHT / 2);
                        ctx.closePath();

                        ctx.strokeStyle = "rgba(69, 162, 158, 0.15)";
                        ctx.stroke();
                    }
                }
            }
        }

        renderScene();

        // Lógica de Movimentação do Joystick Virtual
        const joyZone = document.getElementById('joystick-zone');
        const joyStick = document.getElementById('joystick-stick');
        let isDragging = false;
        let joyVector = { x: 0, y: 0 };

        function handleMove(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let deltaX = clientX - centerX;
            let deltaY = clientY - centerY;
            const distance = Math.min(Math.hypot(deltaX, deltaY), 35);
            const angle = Math.atan2(deltaY, deltaX);

            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            joyStick.style.transform = `translate(${moveX}px, ${moveY}px)`;
            
            joyVector.x = moveX / 35;
            joyVector.y = moveY / 35;
        }

        joyZone.addEventListener('pointerdown', (e) => {
            isDragging = true;
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            if (isDragging) {
                isDragging = false;
                joyStick.style.transform = `translate(0px, 0px)`;
                joyVector = { x: 0, y: 0 };
            }
        });

        // Loop de Atualização da Posição do Jogador
        setInterval(() => {
            if (joyVector.x !== 0 || joyVector.y !== 0) {
                player.worldX += (joyVector.x + joyVector.y) * player.speed;
                player.worldY += (joyVector.y - joyVector.x) * player.speed;
            }
        }, 1000 / 60);

        // Sistema de Interações & Telas
        function togglePhone() {
            const phone = document.getElementById('smartphone');
            phone.classList.toggle('active');
        }

        function openApp(appName) {
            openModal(appName, `Você abriu o aplicativo <b>${appName}</b> direto do seu smartphone.`);
        }

        function interact() {
            let nearest = null;
            let minDist = 2.0;

            worldPointsOfInterests.forEach(pt => {
                const dist = Math.hypot(player.worldX - pt.x, player.worldY - pt.y);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = pt;
                }
            });

            if (nearest) {
                openModal(nearest.name, `Interagindo com a zona de <b>${nearest.name}</b>.`);
            } else {
                openModal("Info", "Nenhum ponto de interesse próximo. Explore a cidade!");
            }
        }

        function useItem() {
            openModal("Item", "Você usou um item do inventário ativo.");
        }

        function sprint() {
            player.speed = player.speed === 0.08 ? 0.16 : 0.08;
            setTimeout(() => { player.speed = 0.08; }, 2000);
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p>${text}</p>`;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
