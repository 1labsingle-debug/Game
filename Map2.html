<script>

/* =====================================================
   ESTADO DO JOGO
===================================================== */

const game = {

    money: 2500,

    reputation: 1,

    player: {
        x: 870,
        y: 560,
        speed: 5
    },

    keys: {
        up: false,
        down: false,
        left: false,
        right: false
    }

};


/* =====================================================
   ELEMENTOS
===================================================== */

const world = document.getElementById("world");
const player = document.getElementById("player");

const interaction = document.getElementById("interaction");
const interactionTitle = document.getElementById("interactionTitle");
const interactionButton = document.getElementById("interactionButton");

const menu = document.getElementById("menu");

const moneyElement = document.getElementById("money");
const repElement = document.getElementById("rep");


/* =====================================================
   MOVIMENTO
===================================================== */

function movePlayer() {

    let dx = 0;
    let dy = 0;

    if (game.keys.up) dy -= game.player.speed;
    if (game.keys.down) dy += game.player.speed;
    if (game.keys.left) dx -= game.player.speed;
    if (game.keys.right) dx += game.player.speed;

    game.player.x += dx;
    game.player.y += dy;

    // limites do mundo

    game.player.x = Math.max(
        0,
        Math.min(1740, game.player.x)
    );

    game.player.y = Math.max(
        0,
        Math.min(1140, game.player.y)
    );

    player.style.left = game.player.x + "px";
    player.style.top = game.player.y + "px";

    updateCamera();
    checkInteractions();

    requestAnimationFrame(movePlayer);
}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera() {

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    let cameraX =
        screenWidth / 2 -
        game.player.x -
        30;

    let cameraY =
        screenHeight / 2 -
        game.player.y -
        40;

    const minX =
        screenWidth - 1800;

    const minY =
        screenHeight - 1200;

    cameraX = Math.min(
        0,
        Math.max(minX, cameraX)
    );

    cameraY = Math.min(
        0,
        Math.max(minY, cameraY)
    );

    world.style.transform =
        `translate(${cameraX}px, ${cameraY}px)`;
}


/* =====================================================
   INTERAÇÃO COM OFICINA
===================================================== */

function checkInteractions() {

    const workshopX = 1110;
    const workshopY = 350;

    const distance = Math.hypot(
        game.player.x - workshopX,
        game.player.y - workshopY
    );

    if (distance < 180) {

        interaction.style.display = "block";

        interactionTitle.textContent =
            "🔧 SPEED GARAGE";

        interactionButton.textContent =
            "Entrar na oficina";

    } else {

        interaction.style.display = "none";

    }
}


/* =====================================================
   ENTRAR NA OFICINA
===================================================== */

interactionButton.addEventListener(
    "click",
    () => {

        alert(
            "🔧 OFICINA\n\n" +
            "A tela da oficina será adicionada na próxima etapa.\n\n" +
            "Aqui vamos colocar:\n" +
            "🏍️ Moto\n" +
            "🔧 Diagnóstico\n" +
            "🛠️ Reparos\n" +
            "🎨 Customização\n" +
            "🏁 Teste"
        );

    }
);


/* =====================================================
   CONTROLES TOUCH
===================================================== */

document.querySelectorAll(".dir")
.forEach(button => {

    const direction =
        button.dataset.dir;

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            game.keys[direction] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            game.keys[direction] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            game.keys[direction] = false;

        }
    );

    button.addEventListener(
        "pointerleave",
        () => {

            game.keys[direction] = false;

        }
    );

});


/* =====================================================
   TECLADO
===================================================== */

const keyMap = {

    ArrowUp: "up",
    w: "up",

    ArrowDown: "down",
    s: "down",

    ArrowLeft: "left",
    a: "left",

    ArrowRight: "right",
    d: "right"

};

window.addEventListener(
    "keydown",
    e => {

        const direction =
            keyMap[e.key];

        if (direction) {

            game.keys[direction] = true;

        }

        if (e.key === "Escape") {

            menu.style.display = "none";

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        const direction =
            keyMap[e.key];

        if (direction) {

            game.keys[direction] = false;

        }

    }
);


/* =====================================================
   BOTÕES DE AÇÃO
===================================================== */

document.getElementById("actionA")
.addEventListener("click", () => {

    checkInteractions();

    if (
        interaction.style.display === "block"
    ) {

        interactionButton.click();

    }

});


document.getElementById("actionB")
.addEventListener("click", () => {

    alert(
        "📋 MISSÕES\n\n" +
        "Nenhuma missão disponível ainda."
    );

});


document.getElementById("actionC")
