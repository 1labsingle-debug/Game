          }
        } else if (type === 'building') {
          ctx.fillStyle = '#b46b4d'; ctx.fillRect(x + 2, y + 3, TILE - 4, TILE - 5);
          ctx.fillStyle = '#7c422f'; ctx.fillRect(x + 4, y + 5, TILE - 8, 8);
          ctx.fillStyle = '#d7bb80';
          ctx.fillRect(x + 10, y + 21, 8, 9); ctx.fillRect(x + 29, y + 21, 8, 9);
          ctx.strokeStyle = '#683e30'; ctx.strokeRect(x + 2, y + 3, TILE - 4, TILE - 5);
        } else if (type === 'workshop') {
          ctx.fillStyle = '#d37632'; ctx.fillRect(x + 1, y + 2, TILE - 2, TILE - 3);
          ctx.fillStyle = '#34281c'; ctx.fillRect(x + 6, y + 20, TILE - 12, TILE - 16);
          ctx.fillStyle = '#ffce54'; ctx.font = 'bold 10px DM Sans'; ctx.fillText('FIX', x + 12, y + 15);
        } else if (type === 'plaza') {
          ctx.fillStyle = '#9fa69a'; ctx.fillRect(x, y, TILE + 1, TILE + 1);
          ctx.fillStyle = '#5d8c69'; ctx.beginPath(); ctx.arc(x + 24, y + 24, 11, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#426443'; ctx.fillRect(x, y, TILE + 1, TILE + 1);
          const h = hash(tx * 17, ty * 31);
          if (h > .67) { ctx.fillStyle = '#315334'; ctx.beginPath(); ctx.arc(x + 17, y + 16, 8, 0, Math.PI * 2); ctx.fill(); }
        }
      }
      function drawCollectible(tx, ty) {
        const id = tx + ':' + ty;
        if (state.collected.has(id) || hash(tx * 11, ty * 9) < .86 || isRoad(tx, ty) || tileType(tx,ty) === 'building') return;
        const x = tx * TILE - camera.x + canvas.width / 2 + TILE / 2;
        const y = ty * TILE - camera.y + canvas.height / 2 + TILE / 2;
        ctx.fillStyle = '#d5ff42'; ctx.fillRect(x - 7, y - 7, 14, 14);
        ctx.strokeStyle = '#172517'; ctx.lineWidth = 2; ctx.strokeRect(x - 7, y - 7, 14, 14);
        if (Math.hypot(player.x - tx*TILE - TILE/2, player.y - ty*TILE - TILE/2) < 22) {
          state.collected.add(id);
          const slot = Math.floor(hash(tx, ty) * 4);
          state.inventory[slot]++;
          state.money += 15;
          state.missions.supplies = Math.min(3, state.missions.supplies + 1);
          showToast('+15 sats · suprimento recolhido');
          updateUI();
        }
      }
      function drawWorld() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const startX = Math.floor((camera.x - canvas.width/2) / TILE) - 1;
        const endX = Math.ceil((camera.x + canvas.width/2) / TILE) + 1;
        const startY = Math.floor((camera.y - canvas.height/2) / TILE) - 1;
        const endY = Math.ceil((camera.y + canvas.height/2) / TILE) + 1;
        for (let ty = startY; ty <= endY; ty++) for (let tx = startX; tx <= endX; tx++) drawTile(tx, ty);
        for (let ty = startY; ty <= endY; ty++) for (let tx = startX; tx <= endX; tx++) drawCollectible(tx, ty);

        const px = canvas.width / 2, py = canvas.height / 2;
        ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(px, py + 13, 16, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#d5ff42'; ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#172517'; ctx.beginPath(); ctx.arc(px, py - 3, 6, Math.PI, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff914d'; ctx.fillRect(px - 10, py + 2, 20, 7);
      }
      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * ratio);
        canvas.height = Math.floor(window.innerHeight * ratio);
        canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
        ctx.scale(ratio, ratio);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      }
      function updateUI() {
        document.getElementById('money-value').textContent = state.money;
        document.getElementById('wallet-money').textContent = state.money;
        state.inventory.forEach((count, i) => document.getElementById('slot-count-' + i).textContent = count);
        document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.toggle('active', Number(el.dataset.slot) === state.activeSlot));
        const progress = state.missions.supplies;
        document.getElementById('mission-progress').style.width = (progress / 3 * 100) + '%';
        document.getElementById('mission-progress-label').textContent = progress + ' / 3 suprimentos';
        document.getElementById('coordinate-value').textContent = Math.floor(player.x / TILE) + ', ' + Math.floor(player.y / TILE);
        document.getElementById('map-player').style.left = (42 + (player.x % WORLD_CHUNK_PX) / WORLD_CHUNK_PX * 25) + '%';
        document.getElementById('map-player').style.top = (38 + (player.y % WORLD_CHUNK_PX) / WORLD_CHUNK_PX * 26) + '%';
      }
      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message; toast.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }
      function interact() {
        if (nearWorkshop) showToast('Oficina Thrnd: diagnóstico concluído. Tudo pronto para rodar.');
        else showToast('Nenhum ponto de interação próximo. Procure o ícone FIX.');
      }
      function update(dt) {
        let mx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0) + joystick.x;
        let my = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0) + joystick.y;
        const length = Math.hypot(mx, my);
        if (length > 1) { mx /= length; my /= length; }
        const nx = player.x + mx * player.speed * dt, ny = player.y + my * player.speed * dt;
        if (canMove(nx, player.y)) player.x = nx;
        if (canMove(player.x, ny)) player.y = ny;
        camera.x += (player.x - camera.x) * Math.min(1, dt * 8);
        camera.y += (player.y - camera.y) * Math.min(1, dt * 8);
        const cx = Math.floor(player.x / WORLD_CHUNK_PX), cy = Math.floor(player.y / WORLD_CHUNK_PX);
        state.visited.add(chunkKey(cx,cy));
        const tx = Math.floor(player.x/TILE), ty = Math.floor(player.y/TILE);
        nearWorkshop = [[0,0],[1,0],[-1,0],[0,1],[0,-1]].some(([a,b]) => tileType(tx+a,ty+b) === 'workshop');
        document.getElementById('objective-card').style.borderColor = nearWorkshop ? '#ff914d' : '';
        updateUI();
      }
      function loop(time) {
        const dt = Math.min(.04, (time-lastTime)/1000); lastTime = time;
        update(dt); drawWorld(); requestAnimationFrame(loop);
      }

      async function saveGame() {
        const button = document.getElementById('save-button');
        const status = document.getElementById('save-status');
        button.disabled = true; button.style.opacity = '.65'; status.textContent = 'Salvando no Canva Sheet...';
        const record = {
          player_x: Math.round(player.x), player_y: Math.round(player.y), money: state.money,
          inventory: JSON.stringify(state.inventory), missions: JSON.stringify(state.missions),
          visited_chunks: JSON.stringify([...state.visited].slice(-200))
        };
        const result = state.saveRecord ? await window.dataSdk.update({...record, __backendId: state.saveRecord.__backendId}) : await window.dataSdk.create(record);
        button.disabled = false; button.style.opacity = '1';
        if (result.isOk) { status.textContent = 'Progresso salvo com sucesso.'; showToast('Cidade salva no Canva Sheet.'); }
        else status.textContent = 'Não foi possível salvar agora. Tente novamente.';
      }
      const dataHandler = {
        onDataChanged(data) {
          if (!state.loaded && data.length) {
            const record = data[0]; state.saveRecord = record; state.loaded = true;
            player.x = Number(record.player_x) || player.x; player.y = Number(record.player_y) || player.y;
            state.money = Number(record.money) || 0;
            try { state.inventory = JSON.parse(record.inventory) || state.inventory; state.missions = JSON.parse(record.missions) || state.missions; state.visited = new Set(JSON.parse(record.visited_chunks) || []); } catch (e) {}
            showToast('Progresso da cidade carregado.');
          } else if (data.length) state.saveRecord = data[0];
          updateUI();
        }
      };

      document.addEventListener('keydown', e => {
        keys[e.key] = true;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
        if (e.key.toLowerCase() === 'e') interact();
        if (e.key.toLowerCase() === 'm') togglePhone();
        if (/^[1-4]$/.test(e.key)) { state.activeSlot = Number(e.key)-1; updateUI(); }
      });
      document.addEventListener('keyup', e => keys[e.key] = false);
      document.getElementById('interact-button').addEventListener('click', interact);
      document.getElementById('phone-toggle').addEventListener('click', togglePhone);
      document.getElementById('phone-close').addEventListener('click', togglePhone);
      document.getElementById('save-button').addEventListener('click', saveGame);

      function togglePhone() { document.getElementById('phone').classList.toggle('open'); }
      document.querySelectorAll('[data-app]').forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('[data-app]').forEach(b => b.classList.toggle('active', b === button));
        document.querySelectorAll('.phone-panel').forEach(panel => panel.classList.toggle('active', panel.id === 'panel-' + button.dataset.app));
      }));
      document.querySelectorAll('.hotbar-slot').forEach(el => el.addEventListener('click', () => { state.activeSlot = Number(el.dataset.slot); updateUI(); }));

      const base = document.getElementById('joystick-base'), knob = document.getElementById('joystick-knob');
      function moveStick(e) {
        const rect = base.getBoundingClientRect(), touch = e.touches ? e.touches[0] : e;
        let x = touch.clientX - rect.left - rect.width/2, y = touch.clientY - rect.top - rect.height/2;
        const distance = Math.hypot(x,y), max = 30;
        if (distance > max) { x = x/distance*max; y = y/distance*max; }
        knob.style.transform = `translate(${x}px, ${y}px)`; joystick.x = x/max; joystick.y = y/max;
      }
      base.addEventListener('pointerdown', e => { joystick.active = true; base.setPointerCapture(e.pointerId); moveStick(e); });
      base.addEventListener('pointermove', e => { if (joystick.active) moveStick(e); });
      function releaseStick() { joystick.active=false; joystick.x=0; joystick.y=0; knob.style.transform='translate(0,0)'; }
      base.addEventListener('pointerup', releaseStick); base.addEventListener('pointercancel', releaseStick);

      window.addEventListener('resize', resize);
      resize(); lucide.createIcons(); updateUI();
      window.dataSdk.init(dataHandler).then(result => {
        if (!result.isOk) document.getElementById('save-status').textContent = 'O salvamento está indisponível no momento.';
      });
      requestAnimationFrame(loop);
    })();
  </script>
 </body>
</html>
